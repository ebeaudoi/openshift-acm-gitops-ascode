apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: acm-clusterset-allcluster

patches:
  - target:
      kind: Policy
    patch: |-
      - op: replace
        path: /metadata/name
        value: ebdn-install-devspace
      - op: replace
        path: /spec/policy-templates/0/objectDefinition/metadata/name
        value: install-devspaces
      - op: replace
        path: /spec/policy-templates/0/objectDefinition/spec/subscription/name
        value: devspaces
      - op: replace
        path: /spec/policy-templates/0/objectDefinition/spec/subscription/namespace
        value: openshift-devspaces
      - op: replace
        path: /spec/policy-templates/0/objectDefinition/spec/subscription/channel
        value: stable

  - target:
      kind: Placement
    patch: |-
      - op: replace
        path: /metadata/name
        value: ebdn-install-devspace-placement
      - op: replace
        path: /spec/clusterSets/0
        value: all-cluster
      - op: replace
        path: /spec/tolerations/0/operator
        value: Exists
      - op: replace
        path: /spec/tolerations/1/operator
        value: Exists

  - target:
      kind: PlacementBinding
    patch: |-
      - op: replace
        path: /metadata/name
        value: ebdn-install-devspace-placement
      - op: replace
        path: /placementRef/name
        value: ebdn-install-devspace-placement
      - op: replace
        path: /subjects/0/name
        value: ebdn-install-devspace
